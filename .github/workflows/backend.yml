name: Check backend deployment

on:
  pull_request:
    paths: ["backend/**", "tests/**", "requirements*.txt", "Dockerfile", ".dockerignore", "compose.yaml", "deploy/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "tests/**", "requirements*.txt", "Dockerfile", ".dockerignore", "compose.yaml", "deploy/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure disposable test environment
        run: |
          cp .env.example .env
          echo 'HERMES_ADMIN_TOKEN=ci-only-not-a-production-secret' >> .env
      - name: Build API image
        run: docker compose build api
      - name: Run backend tests inside the image
        run: |
          docker run --rm --user root -v "$PWD/tests:/app/tests:ro" hermes-api:local sh -c 'pip install "pytest>=8,<9" "httpx>=0.27,<1" && python -m pytest -q'
      - name: Validate proxy configuration
        run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Smoke test deployed API settings
        run: |
          docker compose up -d --wait api
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Clean up disposable CI containers
        if: always()
        run: docker compose down --volumes
