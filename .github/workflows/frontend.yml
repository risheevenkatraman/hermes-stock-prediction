name: Check customer application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
